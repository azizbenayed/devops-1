server:
  readinessProbe:
    enabled: true
    timeoutSeconds: 10
  dev:
    enabled: false
  dataStorage:
    enabled: true
    size: 1Gi
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        address     = "[::]:8200"
        tls_disable = true
      }
      storage "file" {
        path = "/vault/data"
      }
